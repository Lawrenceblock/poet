<h2>旧站原文（逐字）</h2>
<div class="poem"><div class="poem">

那拉提的风我没能赶上  
北门外的雪替我去了  

<br>

有人说过，山那边的水  
住着不肯东归的娘娘  
我没去过，所以相信  

<br>

刘鹗的卦摊早就收了  
八楼的公交车也换了路线  
只有刀郎还在唱  
唱一片胡杨，死而不倒  

</div>
