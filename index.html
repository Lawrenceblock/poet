<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>安然诗客栈</title>
  <link rel="stylesheet" href="style.css">
  <style>
body {
  margin: 0;
  background: #dceef2;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.cover {
  width: 90%;
  max-width: 520px;
  text-align: center;
}

.cover img {
  display: block;
  margin: 0 auto;
  max-width: 360px;
  max-height: 52vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.title {
  margin-top: 1.8em;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 1.65rem;
  letter-spacing: 0.32em;
  color: #1f2a2e;
  text-indent: 0.32em; /* 用字距补视觉居中，因为中文标题有letter-spacing */
  text-align: center;
}

.copy {
  margin-top: 0.9em;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 0.8rem;
  color: #9aa3a6;
  letter-spacing: 0.24em;
  text-indent: 0.24em;
  text-align: center;
}

.note {
  margin-top: 0.55em;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 0.76rem;
  color: #b8c0c2;
  letter-spacing: 0.36em;
  text-indent: 0.36em;
  text-align: center;
}



    
    
    
  </style>
</head>
<body>
  <div class="cover">
    <img src="assets/img/cover.png" alt="封面">
    <div class="site-name">安然诗客栈</div>
    <div class="sub">© 2026</div>
    <div class="note">未赴之境</div>
    <div class="">
        <a href="/poet/archive.md">卷目</a>
        <span class="nav-sep">.</span>
        <a href="/poet/preface.md">题记</a>
    </div>
  </div>
</body>
</html>
